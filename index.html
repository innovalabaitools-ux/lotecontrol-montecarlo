function updateSugg(){
  const box=$('#sugg'); if(!box) return; const pq=pqActual();
  if(!pq || document.activeElement!==$('#q')){ box.classList.add('hidden'); return; }
  const L=lotesArr(); let h='';
  const vacio = pq.lote==null&&pq.mz==null&&pq.num==null&&!pq.est.size&&!pq.mora&&!pq.ubic&&pq.sector==null&&!pq.texto.length;
  if(vacio){ box.innerHTML=`<div class="sg-empty">Escribe el número: <b>${esc(pq.pend||'lote')} 5</b>, o prueba "mz 105", "esquineros disponibles", "sector norte"…</div>`; box.classList.remove('hidden'); return; }
  const ord=(a,b)=>(a.estado==='disponible'?0:1)-(b.estado==='disponible'?0:1)||mzCmp(a.manzana,b.manzana)||a.numero-b.numero;
  const verMz=mz=>{ const mzL=L.filter(l=>norm(l.manzana)===norm(mz)); if(!mzL.length) return ''; const d=mzL.filter(l=>l.estado==='disponible').length;
    return `<div class="sg-i mz" data-go="mz:${esc(mzL[0].manzana)}"><span class="lg mzi">Mz</span><div class="sg-t"><b>Ver toda la manzana ${esc(mzName(mzL[0].manzana))}</b><span>${mzL.length} lotes · ${d} disponibles</span></div><div class="sg-p">→</div></div>`; };
  // un número suelto puede ser lote o manzana: se ofrece la manzana y luego los lotes con ese número
  if(pq.num!=null) h+=verMz(String(pq.num));
  if(pq.mz!=null && pq.lote==null) h+=verMz(pq.mz);
  const m=L.filter(l=>qMatch(l,pq)).sort(ord);
  if(m.length){ const d=m.filter(l=>l.estado==='disponible').length;
    const enMz = (pq.lote!=null||pq.num!=null) && pq.mz==null ? ` en ${new Set(m.map(l=>l.manzana)).size} manzanas` : '';
    h+=`<div class="sg-h">${esc(describirQ(pq)||'Resultados')} <span>${fmtN(m.length)} lote${m.length===1?'':'s'}${enMz} · ${d} disponible${d===1?'':'s'}</span></div>`+m.slice(0,120).map(sugItem).join('');
    if(m.length>120) h+=`<div class="sg-empty"><span>Mostrando 120 de ${fmtN(m.length)}. Agrega una palabra para afinar: "disponible", "esquinero", "mz 12"…</span></div>`; }
  if(!h) h=pq.pend ? `<div class="sg-empty">Escribe el número: <b>${esc(pq.pend)} 5</b>…</div>`
    : `<div class="sg-empty">Ningún lote coincide con “${esc(S.q)}”.<br><span>Prueba: "lote 5", "mz 105", "105-3", "esquineros disponibles", "sector norte", "en mora" o el nombre del cliente.</span></div>`;
  box.innerHTML=h; box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach((it,i)=>{ it.onmousedown=e=>{ e.preventDefault(); goSugg(it); }; it.onmouseenter=()=>{ S.sugIdx=i; markSugg(); }; });
  markSugg();
}
function markSugg(){ const items=[...document.querySelectorAll('#sugg [data-go]')]; items.forEach((it,i)=>it.classList.toggle('on',i===(S.sugIdx||0))); const a=items[S.sugIdx||0]; if(a) a.scrollIntoView({block:'nearest'}); }
function goSugg(it){
  const go=it.dataset.go; $('#sugg')?.classList.add('hidden'); $('#q')?.blur();
  if(go.startsWith('mz:')){ const mz=go.slice(3); S.q='mz '+mz; S.sel=null; render();
    const g=curGeo(); if(g&&S.view==='3d'&&window.P3){ const pts=g.lotes.filter(x=>String(x.mz)===mz).flatMap(x=>x.p); const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);

function zoomAt(f,cx,cy){
  const sc=document.querySelector('.plano-scroll'); if(!sc) return;
  const r=sc.getBoundingClientRect(); const ox=cx-r.left, oy=cy-r.top;
  const fx=(sc.scrollLeft+ox)/sc.scrollWidth, fy=(sc.scrollTop+oy)/sc.scrollHeight;
  const nz=Math.max(1,Math.min(10,S.zoom*f)); if(nz===S.zoom) return; S.zoom=nz;
  render();
  const s2=document.querySelector('.plano-scroll'); if(!s2) return;
  s2.scrollLeft=fx*s2.scrollWidth-ox; s2.scrollTop=fy*s2.scrollHeight-oy;
}
function focusLote(id){

  const a=el.getBoundingClientRect(), r=sc.getBoundingClientRect();
  sc.scrollLeft+=(a.left+a.width/2)-(r.left+r.width/2); sc.scrollTop+=(a.top+a.height/2)-(r.top+r.height/2);

function bindSubmit(form,onOk,okLabel){
  conValidacion(form);
  form.onsubmit=async e=>{ e.preventDefault(); if(!onOk) return cerrarModal();
    const malos=[...form.querySelectorAll('input[required],input[data-v],input[type=number]')].filter(i=>!i.closest('.hidden') && !validarCampo(i));
    if(malos.length){ malos[0].focus(); toast(malos.length===1?'Revisa el campo marcado':`Revisa los ${malos.length} campos marcados`); return; }
    const btn=form.querySelector('[type=submit]'); btn.disabled=true; btn.textContent='Guardando…';
    try{ await onOk(Object.fromEntries(new FormData(form)),form); }
    catch(err){ console.error(err); toast(err?.message || ('No se pudo guardar ('+(err?.code||'error')+')'),4000); btn.disabled=false; btn.textContent=okLabel; }
  };
}

/* validación en línea (NN/g): se revisa al salir del campo y el error se muestra junto al campo */
function validarCampo(i){
  const v=String(i.value||'').trim(); let msg='';
  if(i.required && !v) msg='Este campo es obligatorio';
  else if(v && i.dataset.v==='cedula' && !/^[0-9.\- ]{5,15}$/.test(v)) msg='Solo números (puede llevar puntos o guion)';
  else if(v && i.dataset.v==='tel' && !/^\+?[0-9 ]{7,15}$/.test(v)) msg='Escribe un teléfono válido, ej. 3001234567';
  else if(v && i.dataset.v==='tel' && /^3/.test(v.replace(/\D/g,'')) && v.replace(/\D/g,'').length!==10) msg='Un celular colombiano tiene 10 dígitos';
  else if(v && i.dataset.v==='email' && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) msg='Revisa el correo';
  else if(i.type==='number' && v){ const n=+v, mn=i.getAttribute('min'), mx=i.getAttribute('max');
    if(!isFinite(n)) msg='Escribe solo números';
    else if(mn!==null && n<+mn) msg= +mn===0 ? 'No puede ser negativo' : `Mínimo ${fmtN(+mn)}`;
    else if(mx!==null && n>+mx) msg=`Máximo ${fmtN(+mx)}`;
    else if(!i.getAttribute('step') && !Number.isInteger(n)) msg='Escribe un número entero'; }
  i.classList.toggle('err',!!msg);

  return !msg;
}

/* comprime la captura a JPEG (≤ ~170 KB) para guardarla como evidencia sin pesar en la nube */
async function comprimirImagen(file,max=170000){
  const bmp=await createImageBitmap(file); let w=bmp.width, h=bmp.height; const k=Math.min(1,1400/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
  const cv=document.createElement('canvas'); let q=0.82, url='';
  for(let i=0;i<10;i++){ cv.width=w; cv.height=h; const c=cv.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,w,h); c.drawImage(bmp,0,0,w,h);
    url=cv.toDataURL('image/jpeg',q); if(url.length<=max) break; if(q>0.5) q-=0.1; else { w=Math.round(w*0.8); h=Math.round(h*0.8); } }
  return url;
}
/* campos de pago: el banco y el comprobante aparecen solo para transferencia o consignación */
function wirePago(form){
  const medio=form.querySelector('[name=medio]'); if(!medio) return;
  const rowB=form.querySelector('[data-banco]'), rowO=form.querySelector('[data-banco-otro]'), comp=form.querySelector('[data-comp]');
  const banco=form.querySelector('[name=banco]'), hid=form.querySelector('[name=comprobante]'), file=comp.querySelector('input[type=file]');
  const prev=comp.querySelector('.upl-prev'), zone=comp.querySelector('.upl-zone');
  const upd=()=>{ const t=MEDIOS_BANCO.includes(medio.value); rowB.classList.toggle('hidden',!t); comp.classList.toggle('hidden',!t); rowO.classList.toggle('hidden',!(t&&banco.value==='Otro')); };
  medio.onchange=upd; banco.onchange=upd; upd();
  const usar=async f=>{ if(!f||!/^image\//.test(f.type)) return toast('El comprobante debe ser una imagen (captura o foto)');
    zone.querySelector('b').textContent='Procesando…';
    try{ const url=await comprimirImagen(f); hid.value=url; prev.querySelector('img').src=url; prev.classList.remove('hidden'); zone.classList.add('hidden'); }
    catch(e){ toast('No se pudo leer la imagen'); } finally{ zone.querySelector('b').textContent='Adjuntar comprobante'; } };
  file.onchange=()=>usar(file.files[0]);
  comp.querySelector('[data-quitar]').onclick=()=>{ hid.value=''; file.value=''; prev.classList.add('hidden'); zone.classList.remove('hidden'); };
  zone.ondragover=e=>{ e.preventDefault(); zone.classList.add('over'); }; zone.ondragleave=()=>zone.classList.remove('over');
  zone.ondrop=e=>{ e.preventDefault(); zone.classList.remove('over'); usar(e.dataTransfer.files[0]); };
  form.addEventListener('paste',e=>{ if(comp.classList.contains('hidden')) return; const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/')); if(it){ e.preventDefault(); usar(it.getAsFile()); } });
}

/* Una operación = una sola escritura: el cambio del lote y el pago con su recibo se guardan juntos
   (si algo falla no queda un lote vendido sin recibo). El número de recibo se pide solo después
   de validar, así el consecutivo no queda con huecos. */
const saldoDe = l => l.venta ? resumen(l).saldo : Math.max(0,precioLote(l)-pagado(l));
async function operar(id,aplicar,pago){
  let recibo=null, cid=null, tomado=null, saved=null; const ctx={};
  // el comprobante se guarda primero (si la operación falla queda una imagen huérfana, nunca un pago sin evidencia)
  if(pago?.comprobante && +pago.valor>0){ cid='c'+uid(); await Store.setComprobante(cid,{lote:id,img:pago.comprobante,ts:Date.now(),por:S.uid||'local'}); }
  try{
    saved = await Store.mutateLote(id, async x=>{
      // reintento de una operación que sí alcanzó a guardarse (se cortó la red antes de confirmar): no se repite
      if(pago?.op){ const prev=(x.pagos||[]).find(p=>p.op===pago.op); if(prev) throw Object.assign(new Error('ya guardado'),{yaGuardado:prev}); }
      if(aplicar) aplicar(x);
      const valor=Math.round(+pago?.valor||0);
      if(valor>0){
        const r=resumen(x), saldo=saldoDe(x);
        if((x.venta||precioLote(x)>0) && valor>saldo) throw new Error(`El pago (${fmt(valor)}) supera el saldo pendiente (${fmt(saldo)}).`);
        const refN=String(pago.ref||'').trim().toLowerCase();
        const gemelo=refN && (x.pagos||[]).find(p=>+p.valor===valor && p.fecha===pago.fecha && String(p.ref||'').trim().toLowerCase()===refN);
        if(gemelo) throw new Error(`Ya existe el recibo N° ${pad(gemelo.recibo)} de esta fecha por ${fmt(valor)} con la misma referencia (${pago.ref}). Si es otro pago, revisa la referencia.`);
        const n=await Store.nextRecibo(ctx); tomado=n; const nTxt=n?pad(n):'{{N}}';
        const c=pago.concepto || (r.prox ? (valor>=r.prox.valor-r.prox.pagado?'Pago ':'Abono a ')+r.prox.label.toLowerCase() : 'Abono');
        recibo={id:uid(),recibo:n,fecha:pago.fecha,valor,medio:pago.medio,banco:pago.banco||'',ref:pago.ref||'',concepto:c,por:S.uid||'local',ts:Date.now(),op:pago.op||'',cliente:{nombre:x.cliente?.nombre||'',cedula:x.cliente?.cedula||''}};
        if(cid) recibo.comprobante=cid;
        (x.pagos=x.pagos||[]).push(recibo);
        recibo.saldoDespues=saldoDe(x);
        hist(x,`Recibo N° ${nTxt} por ${fmt(valor)} (${c}, ${pago.medio}${pago.banco?' · '+pago.banco:''})${cid?' · con comprobante':''}`);
      }
      return x;
    }, ctx);
  }catch(e){
    if(e?.yaGuardado) return e.yaGuardado;
    if(tomado){ try{ await Store.anularRecibo(tomado, e?.message||'Operación no completada'); }catch(err){ console.error(err); } }
    throw e;
  }
  if(recibo && saved){ const g=(saved.pagos||[]).find(p=>p.id===recibo.id); if(g) recibo=g; }   // trae el número real asignado por el servidor
  return recibo;
}
const clienteDe = d => ({nombre:d.nombre.trim(),cedula:d.cedula.trim(),telefono:d.telefono.trim(),correo:d.correo.trim()});
function pagoDe(d,concepto){
  const conBanco=MEDIOS_BANCO.includes(d.medio);
  const banco = conBanco ? (d.banco==='Otro' ? (d.bancoOtro||'').trim() : d.banco) : '';
  if(conBanco && +d.pvalor>0 && !banco) throw new Error('Escribe a qué banco o cuenta llegó la transferencia.');
  return {valor:d.pvalor,fecha:d.fecha,medio:d.medio,banco,ref:d.ref,concepto,comprobante:conBanco?d.comprobante:'',op:d.op||''};
}

    `Fecha: ${fDate(p.fecha)}`, `Recibimos de: ${p.cliente?.nombre||l.cliente?.nombre}`, `C.C. / NIT: ${p.cliente?.cedula||l.cliente?.cedula}`,
    `Concepto: ${p.concepto}`, `Inmueble: ${loteName(l)}`, `Medio de pago: ${p.medio}${p.banco?' · '+p.banco:''}${p.ref?' · Ref. '+p.ref:''}`, L,
    ...(precio>0?[`Valor del inmueble: ${fmt(precio)}`,`Total abonado: ${fmt(Math.max(0,precio-saldo))}`]:[]), `*Saldo pendiente: ${fmt(saldo)}*`, '', '¡Gracias por su pago!'].join('\n');
}
/* anotaciones de la hoja: máx. 300 caracteres, se guardan al salir de la celda */
const limpiaNota = t => String(t||'').replace(/\s+/g,' ').trim().slice(0,300);
async function guardarNota(id,texto,orig){
  const t=limpiaNota(texto), cur=S.lotes[id]?.nota||'';
  if(!S.canWrite || !S.lotes[id]) return;
  if(t===cur){ if(t!==String(texto||'').trim()) render(); return; }
  const base = orig==null ? null : limpiaNota(orig);
  try{
    await Store.mutateLote(id,x=>{ if(base!==null && (x.nota||'')!==base) throw Object.assign(new Error('conflicto'),{conflicto:x.nota||''}); x.nota=t; return x; });
    S._notaOk={id,hasta:Date.now()+1200}; const td=document.querySelector(`.nota[data-nota="${CSS.escape(id)}"]`); if(td) td.classList.add('guardada');
  }catch(e){
    if(e && e.conflicto!==undefined) return conflictoNota(id,t,e.conflicto);
    console.error(e); toast('No se pudo guardar la nota. Tu texto sigue en la celda: intenta de nuevo.',4000);
  }
}
/* dos personas editaron la misma nota: se muestra la de la otra persona y se decide */
function conflictoNota(id,mia,suya){
  modal('Otra persona cambió esta nota',`<p class="muted" style="margin-top:0">Mientras escribías, alguien más guardó otra nota en ${esc(loteName({id,...S.lotes[id]}))}.</p>
    <div class="f"><label class="full">Nota guardada por la otra persona<textarea readonly rows="2">${esc(suya)}</textarea></label>
    <label class="full">Tu versión<textarea readonly rows="2">${esc(mia)}</textarea></label></div>`,
    async()=>{ await Store.mutateLote(id,x=>{ x.nota=mia; return x; }); cerrarModal(); toast('Nota guardada'); },'Guardar la mía');
}
/* historial de recibos de un lote */
function verRecibosLote(id,origen){
  const l={id,...S.lotes[id]}; const ps=[...(l.pagos||[])].reverse();
  const f=modal(`Recibos · ${loteName(l)}`, ps.length?`<div class="tbl-wrap" style="max-height:60vh"><table><thead><tr><th>Recibo</th><th>Fecha</th><th class="n">Valor</th><th>Concepto</th><th>Medio</th></tr></thead><tbody>
    ${ps.map(p=>`<tr><td><button type="button" class="btn sm" data-ver-recibo="${esc(p.id)}">N° ${pad(p.recibo)}</button></td><td>${fDate(p.fecha)}</td><td class="n">${fmt(p.valor)}</td><td>${esc(p.concepto)}</td><td class="muted">${esc(p.medio||'')}${p.banco?' · '+esc(p.banco):''}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="muted">Este lote aún no tiene recibos.</p>', null, '');
  if(origen){ const r=origen.getBoundingClientRect(), m=f.getBoundingClientRect(); f.style.transformOrigin=`${Math.round(r.left+r.width/2-m.left)}px ${Math.round(r.top+r.height/2-m.top)}px`; f.style.setProperty('--s0','.9'); }
  f.querySelectorAll('[data-ver-recibo]').forEach(b=>b.onclick=()=>verRecibo(l, ps.find(p=>p.id===b.dataset.verRecibo)));
}
function verRecibo(l,p){
  if(!p) return; const P=S.proyectos[S.pid]||{}; const T=TEMAS[P.tema];
  const fechaL=new Date(p.fecha+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
  const precio=l.venta?+l.venta.precioFinal:precioLote(l), saldo=Math.max(0,+p.saldoDespues||0), abonado=Math.max(0,precio-saldo);
  const pct=precio>0?Math.min(100,Math.round(abonado/precio*100)):0;
  const f=modal(`Recibo de caja N° ${pad(p.recibo)}`,`<div class="recibo">
    ${T?.logo?`<img class="r-wm" src="${T.logo}" alt="">`:''}
    <div class="r-top ${T?.logoFull?'dark':''}">
      ${T?.logoFull?`<img src="${T.logoFull}" alt="${esc(P.nombre)}">`:`<div class="r-brand"><b>${esc(P.nombre)}</b><small>${esc(P.ubicacion||'')}</small></div>`}
      <div class="r-id"><span class="r-kick">Recibo de caja</span><b class="r-no">N° ${pad(p.recibo)}</b><span class="r-date">${esc(fechaL)}${P.ubicacion&&T?.logoFull?' · '+esc(P.ubicacion):''}</span></div>
    </div>
    <div class="r-body">
      <div class="r-amount"><div><span class="r-lbl">La suma de</span><b class="r-val">${fmt(p.valor)}</b><i class="r-words">${esc(letras(p.valor))} m/cte</i></div>
        <div class="r-stamp" aria-hidden="true"><div>Recibido<small>${fDate(p.fecha)}</small></div></div></div>
      <div class="r-grid">
        <div class="r-f w2"><span>Recibimos de</span><b>${esc(p.cliente?.nombre||l.cliente?.nombre||'—')}</b></div>
        <div class="r-f"><span>C.C. / NIT</span><b>${esc(p.cliente?.cedula||l.cliente?.cedula||'—')}</b></div>
        <div class="r-f"><span>Concepto</span><b>${esc(p.concepto)}</b></div>
        <div class="r-f"><span>Inmueble</span><b>${esc(loteName(l))}</b>${l.area?`<small>${fmtA(l.area)} m²</small>`:''}</div>
        <div class="r-f"><span>Medio de pago</span><b>${esc(p.medio)}${p.banco?' · '+esc(p.banco):''}</b>${p.ref?`<small>Ref. ${esc(p.ref)}</small>`:''}
          ${p.comprobante?`<div class="r-comp"><button type="button" class="btn sm" id="verComp">Ver comprobante adjunto</button></div>`:''}</div>
      </div>
      ${precio>0?`<div class="r-acct"><div><span>Valor del inmueble</span><b>${fmt(precio)}</b></div><div><span>Total abonado</span><b>${fmt(abonado)}</b></div><div><span>Saldo pendiente</span><b>${fmt(saldo)}</b></div></div><div class="r-prog"><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}% del inmueble pagado</span></div>`
        :`<div class="r-acct" style="grid-template-columns:1fr"><div><span>Saldo pendiente</span><b>${fmt(saldo)}</b></div></div>`}
    </div>
    <div class="r-foot"><span>Registrado por <b data-uid="${esc(p.por)}">Usuario</b> · ${fTs(p.ts)}</span><span>Documento interno de caja · no reemplaza la factura electrónica</span></div>
  </div>`,null,'',{extra:'<button type="button" class="btn" id="prR">Imprimir / PDF</button><button type="button" class="btn" id="cpR">Copiar para WhatsApp</button>'});
  f.querySelector('#cpR').onclick=()=>copiar(reciboTexto(l,p),'Recibo copiado: pégalo en WhatsApp');
  f.querySelector('#prR').onclick=()=>{ document.body.classList.add('imprimiendo'); const fin=()=>{ document.body.classList.remove('imprimiendo'); removeEventListener('afterprint',fin); }; addEventListener('afterprint',fin);
    try{ print(); }catch(e){ fin(); toast('Este navegador no permite imprimir desde aquí: usa Ctrl+P'); } setTimeout(fin,1500); };
  const vc=f.querySelector('#verComp'); if(vc) vc.onclick=()=>verComprobante(p.comprobante,`Comprobante · Recibo N° ${pad(p.recibo)}`);
  fillNames();
}

function modalAjustes(){
  if(!S.canWrite||!S.pid) return; const P=S.proyectos[S.pid]||{};
  const f=modal('Ajustes del proyecto',`<div class="f">
    <label class="full">Nombre del proyecto *<input name="nombre" required value="${esc(P.nombre)}"></label>
    <label class="full">Ubicación<input name="ubicacion" value="${esc(P.ubicacion)}"></label>
    <label class="full">Valor por m² (solo para lotes sin precio de lista)<input name="valorM2" type="number" min="0" step="1000" value="${+P.valorM2||''}"></label>
    <label class="full">Valor de separación<input name="sepValor" type="number" min="0" step="50000" value="${+P.sepValor||1000000}"></label>
    <label>Cuota inicial (%)<input name="ciPct" type="number" min="0" max="100" value="${+P.ciPct||30}"></label>
    <label>Número de cuotas<input name="cuotas" type="number" min="1" max="240" value="${+P.cuotas||24}"></label>
    <label class="full">Bancos o cuentas que reciben pagos (uno por línea)<textarea name="bancos" rows="4">${esc(bancosProyecto().join('\n'))}</textarea></label>
    <div class="full sec-h">Consecutivo de recibos</div><div class="full muted" id="audRec">Revisando el consecutivo…</div></div>`,
    async d=>{ const n={...P,nombre:d.nombre.trim(),ubicacion:d.ubicacion.trim(),valorM2:+d.valorM2||0,sepValor:+d.sepValor,ciPct:+d.ciPct,cuotas:+d.cuotas,bancos:String(d.bancos||'').split('\n').map(s=>s.trim()).filter(Boolean)};
      const h=await Store.lock('proyectos/'+S.pid);
      try{ await Store.setProyecto(S.pid,n); } finally { h.soltar(); }
      cerrarModal(); toast('Ajustes guardados'); });
  liveMoney(f);
  auditoriaRecibos().then(t=>{ const e=f.querySelector('#audRec'); if(e) e.innerHTML=t; }).catch(()=>{ const e=f.querySelector('#audRec'); if(e) e.textContent='No se pudo revisar el consecutivo.'; });
}
/* números del consecutivo que no tienen recibo: los anulados dicen por qué; los demás se marcan sin motivo */
async function auditoriaRecibos(){
  const c=await Store.configRecibos(), ultimo=+c.ultimo||0;
  const usados=new Set(); Object.values(S.lotes).forEach(l=>{ (l.pagos||[]).forEach(p=>usados.add(+p.recibo)); (l.archivo||[]).forEach(a=>(a.pagos||[]).forEach(p=>usados.add(+p.recibo))); });
  const motivo=new Map((c.anulados||[]).map(a=>[+a.n,a.motivo]));
  const huecos=[]; for(let n=1;n<=ultimo;n++) if(!usados.has(n)) huecos.push(n);
  if(!ultimo) return 'Aún no se ha emitido ningún recibo.';
  if(!huecos.length) return `Último recibo: N° ${pad(ultimo)}. Consecutivo completo, sin números perdidos${S.mode==='sb'?' (lo asigna la base de datos, nunca se repite ni se salta)':''}.`;
  return `Último recibo: N° ${pad(ultimo)}. ${huecos.length} número${huecos.length>1?'s':''} sin recibo:<ul style="margin:6px 0 0;padding-left:18px">${huecos.slice(-30).map(n=>`<li>N° ${pad(n)} — ${esc(motivo.get(n)||'sin motivo registrado (operación interrumpida)')}</li>`).join('')}</ul>`;
}
